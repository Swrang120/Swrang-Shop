<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Address</title>

<link rel="stylesheet" href="address.css">
</head>

<body>

<header class="header">
    <h2>🛍️ MS Shopping</h2>
</header>

<div class="container">

<h2>Delivery Address</h2>

<form id="addressForm">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="tel"
id="mobile"
placeholder="Mobile Number"
required>

<textarea
id="address"
placeholder="Full Address"
required></textarea>

<input
type="text"
id="city"
placeholder="City"
required>

<input
type="text"
id="state"
placeholder="State"
required>

<input
type="number"
id="pin"
placeholder="PIN Code"
required>

<button
type="submit"
class="continueBtn">
Continue To Payment →
</button>

</form>

</div>

<script src="address.js"></script>

</body>
</html>
