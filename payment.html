<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Payment - MS Shopping</title>

<link rel="stylesheet" href="payment.css">
</head>

<body>

<header class="header">
<h2>🛍️ MS Shopping</h2>
</header>

<div class="container">

<h2>Delivery Address</h2>

<div id="addressBox" class="address-box">

Loading Address...

</div>

<hr>

<h2>Order Summary</h2>

<div id="orderSummary">

Loading Products...

</div>

<h2>Total Amount</h2>

<h1 id="totalPrice">₹0</h1>

<hr>

<h2>Choose Payment Method</h2>

<label class="method">

<input type="radio" name="pay" checked>

UPI Payment ✅

</label>

<label class="method cod">

<input type="radio" onclick="codMessage()">

Cash On Delivery

<p class="not">

❌ Not Available In Your Area

</p>

</label>

<hr>

<h2>Scan & Pay</h2>

<img
src="images/upi-qr.png"
class="qr">

<h3>Navi UPI</h3>

<b>swrangboro48@nyes</b>

<br><br>

<input
type="text"
id="utr"
placeholder="Enter UTR / Transaction ID">

<button
class="verify"
onclick="verifyPayment()">

Verify Payment

</button>

</div>

<script src="payment.js"></script>

</body>
</html>
