<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - MS Shopping</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">
    <div class="logo">🛍️ MS Shopping</div>
</header>

<h2 class="title">Checkout</h2>

<div class="checkout">

<h3>Delivery Details</h3>

<input type="text" id="name" placeholder="Full Name">

<input type="tel" id="mobile" placeholder="Mobile Number">

<textarea id="address" placeholder="Full Address"></textarea>

<input type="text" id="city" placeholder="City">

<input type="text" id="state" placeholder="State">

<input type="text" id="pin" placeholder="PIN Code">

<h3>Payment Method</h3>

<label>
<input type="radio" name="pay" value="upi">
UPI Payment (Advance ₹100)
</label>

<br><br>

<label>
<input type="radio" name="pay" value="cod">
Cash On Delivery
</label>

<div id="upiBox" style="display:none;">

<h3>UPI Payment</h3>

<p><b>Navi UPI:</b> swrangboro48@nyes</p>

<p><b>PhonePe UPI:</b> swrangboro4739@axl</p>

<button class="buy" onclick="copyUPI()">
Copy UPI ID
</button>

<br><br>

<input
type="text"
id="utr"
placeholder="Enter UTR / Transaction ID">

<button
class="buy"
onclick="submitPayment()">
Submit Payment Verification
</button>

</div>

<br>

<button
class="buy"
onclick="placeOrder()">
Place Order
</button>

</div>

<!-- Checkout JavaScript -->
<script type="module" src="checkout.js"></script>

</body>
</html>
